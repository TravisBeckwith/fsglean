[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fsglean"
version = "0.1.0"
description = "BIDS-aware extraction of FreeSurfer stats files into tidy, longitudinal tables."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.3",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
fsglean = "fsglean.cli:main"
